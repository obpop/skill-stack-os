spring:
  config:
    activate:
      on-profile: prod
  security:
    oauth2:
      client:
        registration:
          auth0:
            provider: auth0
            client-id: ${AUTH0_CLIENT_ID}
            client-secret: ${AUTH0_CLIENT_SECRET}
            client-authentication-method: ${AUTH0_CLIENT_AUTHENTICATION_METHOD:client_secret_post}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          auth0:
            issuer-uri: ${AUTH0_ISSUER_URI}
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI}
          audiences:
            - ${AUTH0_AUDIENCE}
  datasource:
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:10}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:2}
      connection-timeout: 5000
      validation-timeout: 3000
      leak-detection-threshold: 30000
  session:
    timeout: 30m
    cookie:
      http-only: true
      secure: true
      same-site: lax

server:
  tomcat:
    connection-timeout: 10s
    max-connections: 200
    accept-count: 50
    threads:
      max: 80
      min-spare: 5

management:
  endpoint:
    health:
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,diskSpace,backgroundJobs

info:
  app:
    name: skill-stack
    version: ${RELEASE_VERSION:unknown}

skillstack:
  demo-seed-enabled: false

logging:
  structured:
    format:
      console: ecs
