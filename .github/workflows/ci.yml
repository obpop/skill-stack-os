name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8080/api/v1
          NEXT_PUBLIC_AUTH_MODE: local
          NEXT_PUBLIC_AUTH_LOGIN_URL: /oauth2/authorization/auth0
          NEXT_PUBLIC_EXPANDED_UNIVERSE: "false"
          DEPLOYMENT_VERSION: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Start PostgreSQL and local backend for browser acceptance
        run: |
          docker compose up -d --wait postgres
          mvn --batch-mode --file backend/pom.xml spring-boot:start -Dspring-boot.run.profiles=local
        env:
          AI_ENABLED: "false"
          AI_MONTHLY_BUDGET_USD: "0"
          AI_TOTAL_BUDGET_USD: "0"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Stop browser acceptance services
        if: always()
        run: |
          mvn --batch-mode --file backend/pom.xml spring-boot:stop || true
          docker compose down --volumes

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode --file backend/pom.xml test

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  containers:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose configuration
        shell: bash
        run: |
          cp deploy/env.production.example /tmp/skill-stack-ci.env
          docker compose --env-file /tmp/skill-stack-ci.env -f compose.production.yml config --quiet
          bash -n deploy/scripts/*.sh deploy/postgres/init/*.sh
      - name: Build production images
        run: |
          docker build --build-arg RELEASE_VERSION=${GITHUB_SHA} -t skill-stack-frontend:${GITHUB_SHA} .
          docker build --build-arg RELEASE_VERSION=${GITHUB_SHA} -t skill-stack-backend:${GITHUB_SHA} backend
