name: skill-stack-recovery

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skillstack_recovery
      POSTGRES_USER: recovery_admin
      POSTGRES_PASSWORD: ${RECOVERY_DB_PASSWORD:?Set RECOVERY_DB_PASSWORD}
    tmpfs:
      - /var/lib/postgresql/data:size=1g,mode=700
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery_admin -d skillstack_recovery"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - recovery
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 150

networks:
  recovery:
    internal: true
