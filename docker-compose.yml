name: skill-stack

services:
  postgres:
    image: postgres:16-alpine
    container_name: skillstack-postgres
    environment:
      POSTGRES_DB: skillstack
      POSTGRES_USER: skillstack
      POSTGRES_PASSWORD: skillstack_local
    ports:
      - "5432:5432"
    volumes:
      - skillstack_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillstack -d skillstack"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  skillstack_postgres:
